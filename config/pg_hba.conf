# SIG-TEC - pg_hba.conf compartido por los 6 nodos
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Conexiones locales dentro del contenedor (scripts de init, respaldos)
local   all             all                                     trust
local   replication     all                                     trust

# Conexiones normales (QGIS, complemento PyQGIS, suscripciones lógicas)
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             0.0.0.0/0               scram-sha-256
host    all             all             ::/0                    scram-sha-256

# Conexiones de replicación física (pg_basebackup, pg_receivewal)
host    replication     all             0.0.0.0/0               scram-sha-256
host    replication     all             ::/0                    scram-sha-256
